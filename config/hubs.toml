# The twelve fictional hubs (docs/PLAN.md, section 6). Each sits at its city's
# main airport; Dallas uses Love Field.
#
# Only identity is typed here. Where a hub sits is read from the data sources
# at ingest and never typed: coordinates from the station's own metadata, the
# county from FEMA's county layer, the warning zones from the warning archive.
# `uv run wra data-report` prints what was resolved.
#
# station: the airport's id at the NOAA station service (ACIS).
# tz:      the hub's time zone, used to assign warning hours to calendar years.

[[hub]]
id = "ORD"
city = "Chicago"
state = "IL"
region = "midwest"
station = "ORD"
tz = "America/Chicago"

