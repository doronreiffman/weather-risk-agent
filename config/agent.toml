# How the agent calls Claude (docs/PLAN.md, section 9). Settings, not code:
# WRA_MODEL and WRA_EFFORT in the environment override the two below.

# Owner's choice after milestone 5's comparison (docs/EVAL_RESULTS.md): Haiku 5.5 matched Opus 5.5 within one
# case run at about 1/27 of the cost per answer. Built and tuned on claude-opus-5-5.
model = "claude-haiku-5-5"
effort = "medium"           # Haiku 5.5's own default, set explicitly; the comparison ran every model at medium
max_tokens = 16000          # per model call; non-streaming
max_model_calls = 6         # per user message (plan section 8.4)
timeout_seconds = 60        # per model call; measured calls take 4 to 8 seconds (owner, 2026-11-24)
max_retries = 1             # per model call, made by the agent loop, not the SDK, so it fits the limit below
message_time_limit_seconds = 90  # per user message, all model calls and the retry included (owner, milestone 4)
max_conversations = 200     # held in memory; past it the least recently used is dropped (docs/DEPLOY_DESIGN.md 5.4)
daily_question_limit = 100  # public mode only: questions a day, UTC, across everyone (docs/DEPLOY_DESIGN.md 5.3)

# Server-side refusal fallback: when the model's safety system declines, the
# API re-runs the request on a substitute model chosen by the refusal's category.
# Off: Haiku 5.5 has none, and with "default" a declined request stays declined
# (Claude API reference, Migrating to Claude Haiku 5.5). Set "default" for Opus or Sonnet.
fallback_beta = "server-side-fallback-2026-07-01"
fallbacks = ""

# List prices in US dollars per million tokens, checked against the live pricing
# page (platform.claude.com/docs/en/about-claude/pricing) on 2026-11-24 (open
# point O8). Used only to report what an evaluation run cost. Cache writes
# (5-minute cache) are billed at 1.25 times input. Haiku's prices are those for
# prompts up to 100,000 tokens; this agent's prompts stay far below that.
[prices.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20

[prices.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.10

[prices.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
